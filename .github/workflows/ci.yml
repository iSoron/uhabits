name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build APK and run JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Formatting and CSV fixtures expect decimal points.
      JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK and run unit tests
        run: >-
          ./gradlew --no-daemon --console=plain --stacktrace --continue
          :uhabits-android:assembleDebug
          :uhabits-core:jvmTest
          :uhabits-android:testDebugUnitTest

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-apk
          path: uhabits-android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            uhabits-core/build/reports/tests/
            uhabits-core/build/test-results/
            uhabits-android/build/reports/tests/
            uhabits-android/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
