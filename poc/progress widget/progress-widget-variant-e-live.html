<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress Widget - Variant E Live</title>
  <style>
    :root {
      --ink: #1e1e1e;
      --muted: #6a6a6a;
      --card: #f4f4f4;
      --ring-track: #cfcfcf;
      --accent: #e36a3a;
      --accent-2: #2f6e66;
      --accent-3: #c2a23c;
      --accent-4: #5061c4;
      --pos: #2f8f4e;
      --neg: #c63d3d;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Roboto", "Noto Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f1f1f1;
    }

    header {
      padding: 18px 18px 6px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 6px;
      letter-spacing: 0.3px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .layout {
      display: grid;
      gap: 12px;
      padding: 12px 18px 24px;
    }

    .controls {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .controls h2 {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    input, select {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
      background: #fafafa;
      color: var(--ink);
    }

    .theme-toggle {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .mock {
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      padding: 10px 12px 12px;
      box-shadow: var(--shadow);
    }

    .kv-list {
      display: grid;
      gap: 3px;
      font-size: 13px;
    }

    .kv-row {
      display: grid;
      grid-template-columns: 120px 1fr 50px 34px;
      gap: 6px;
      align-items: center;
    }

    .label {
      text-align: left;
      white-space: nowrap;
    }

    .kv-row .value {
      font-weight: 400;
      font-size: 13px;
      text-align: center;
    }

    .rank {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    .ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: conic-gradient(var(--ring-color) var(--ring-deg), var(--ring-track) 0deg);
      display: grid;
      place-items: center;
      margin-left: auto;
    }

    .ring::after {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--card);
    }

    .progress-bar {
      width: 28px;
      height: 6px;
      border-radius: 999px;
      background: var(--ring-track);
      position: relative;
      overflow: hidden;
      margin-left: auto;
    }

    .progress-bar::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -2px;
      width: 1px;
      height: 10px;
      background: rgba(0, 0, 0, 0.25);
    }

    .progress-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--pos);
    }

    .progress-fill.negative {
      background: var(--neg);
    }

    .viz-empty {
      width: 28px;
      height: 6px;
      margin-left: auto;
    }

    .theme-light {
      background: #f4f4f4;
      color: #1e1e1e;
      --card: #f4f4f4;
      --ring-track: #cfcfcf;
    }

    .theme-dark {
      background: #2b2b2b;
      color: #f0f0f0;
      --muted: #b0b0b0;
      --card: #2b2b2b;
      --ring-track: #444444;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .theme-pitch {
      background: #121212;
      color: #f4f4f4;
      --muted: #a6a6a6;
      --card: #121212;
      --ring-track: #2a2a2a;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

  </style>
</head>
<body>
  <header>
    <h1>Variant E - Compact List (Live Controls)</h1>
    <p>Adjust values to preview progress range, rings, and streak change visuals.</p>
  </header>

  <section class="layout">
    <div class="controls">
      <h2>Controls</h2>
      <div class="row">
        <label>Progress % (-1.98765 to +1.98765)
          <input id="progress" type="number" step="0.00001" value="-1.98765" />
        </label>
        <label>Progress Rank Today
          <input id="progressRank" type="number" step="1" value="42" />
        </label>
        <label>Score % (0 to 100)
          <input id="score" type="number" step="0.00001" value="44.30123" />
        </label>
        <label>Score Rank Today
          <input id="scoreRank" type="number" step="1" value="21" />
        </label>
      </div>
      <div class="row">
        <label>Completion Done
          <input id="completionDone" type="number" step="1" value="7" />
        </label>
        <label>Completion Due
          <input id="completionDue" type="number" step="1" value="9" />
        </label>
        <label>Completion Rank Today
          <input id="completionRank" type="number" step="1" value="133" />
        </label>
        <label>Streak Yesterday
          <input id="streakYesterday" type="number" step="1" value="12" />
        </label>
      </div>
      <div class="row">
        <label>Streak Today
          <input id="streakToday" type="number" step="1" value="13" />
        </label>
        <label>Streak Rank Today
          <input id="streakRank" type="number" step="1" value="5" />
        </label>
        <label>Rank Total
          <input id="rankTotal" type="number" step="1" value="150" />
        </label>
        <label>Theme
          <select id="theme">
            <option value="theme-light">Light</option>
            <option value="theme-dark">Dark</option>
            <option value="theme-pitch">Pitch Dark</option>
          </select>
        </label>
      </div>
    </div>

    <div class="mock theme-light" id="mock">
      <div class="kv-list">
        <div class="kv-row">
          <div class="label">Progress</div>
          <div class="value" id="progressValue">+1.98765%</div>
          <div class="rank" id="progressRankOut">42/150</div>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <div class="kv-row">
          <div class="label">Streak by progress</div>
          <div class="value" id="streakValue">12 -> 13d</div>
          <div class="rank" id="streakRankOut">5/150</div>
          <div class="viz-empty"></div>
        </div>
        <div class="kv-row">
          <div class="label">Score</div>
          <div class="value" id="scoreValue">84.30123%</div>
          <div class="rank" id="scoreRankOut">21/150</div>
          <div class="ring" id="scoreRing" style="--ring-color: var(--accent-3); --ring-deg: 300deg;"></div>
        </div>
        <div class="kv-row">
          <div class="label">Completion</div>
          <div class="value" id="completionValue">7/9 (77.78%)</div>
          <div class="rank" id="completionRankOut">133/150</div>
          <div class="ring" id="completionRing" style="--ring-color: var(--accent-2); --ring-deg: 280deg;"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function formatFixed(value, digits) {
      return value.toFixed(digits);
    }

    function formatSigned(value) {
      const sign = value > 0 ? "+" : "";
      return sign + formatFixed(value, 5) + "%";
    }

    function update() {
      const progress = parseFloat(document.getElementById("progress").value || 0);
      const progressRank = parseInt(document.getElementById("progressRank").value || 0, 10);
      const score = parseFloat(document.getElementById("score").value || 0);
      const scoreRank = parseInt(document.getElementById("scoreRank").value || 0, 10);
      const completionDone = parseInt(document.getElementById("completionDone").value || 0, 10);
      const completionDue = parseInt(document.getElementById("completionDue").value || 0, 10);
      const completionRank = parseInt(document.getElementById("completionRank").value || 0, 10);
      const streakYesterday = parseInt(document.getElementById("streakYesterday").value || 0, 10);
      const streakToday = parseInt(document.getElementById("streakToday").value || 0, 10);
      const streakRank = parseInt(document.getElementById("streakRank").value || 0, 10);
      const rankTotal = parseInt(document.getElementById("rankTotal").value || 1, 10);
      const theme = document.getElementById("theme").value;

      const progressClamped = clamp(progress, -1.98765, 1.98765);
      const progressPercent = (progressClamped + 1.98765) / (1.98765 * 2);
      const scoreClamped = clamp(score, 0, 100);
      const completionPercent = completionDue > 0 ? (completionDone / completionDue) * 100 : 0;

      document.getElementById("progressValue").textContent = formatSigned(progressClamped);
      document.getElementById("progressRankOut").textContent = progressRank + "/" + rankTotal;

      const progressFill = document.getElementById("progressFill");
      const progressBar = document.getElementById("progressBar");
      const barWidth = progressBar.clientWidth;
      const half = barWidth / 2;
      const fillWidth = Math.abs(progressPercent - 0.5) * 2 * half;
      progressFill.style.width = fillWidth + "px";
      if (progressClamped >= 0) {
        progressFill.style.left = half + "px";
        progressFill.classList.remove("negative");
      } else {
        progressFill.style.left = (half - fillWidth) + "px";
        progressFill.classList.add("negative");
      }

      document.getElementById("scoreValue").textContent = formatFixed(scoreClamped, 5) + "%";
      document.getElementById("scoreRankOut").textContent = scoreRank + "/" + rankTotal;
      document.getElementById("scoreRing").style.setProperty("--ring-deg", (scoreClamped / 100 * 360) + "deg");

      document.getElementById("streakValue").textContent = streakYesterday + " -> " + streakToday + "d";
      document.getElementById("streakRankOut").textContent = streakRank + "/" + rankTotal;

      document.getElementById("completionValue").textContent = completionDone + "/" + completionDue + " (" + formatFixed(completionPercent, 2) + "%)";
      document.getElementById("completionRankOut").textContent = completionRank + "/" + rankTotal;
      document.getElementById("completionRing").style.setProperty("--ring-deg", (completionPercent / 100 * 360) + "deg");

      const mock = document.getElementById("mock");
      mock.classList.remove("theme-light", "theme-dark", "theme-pitch");
      mock.classList.add(theme);
    }

    document.querySelectorAll("input, select").forEach((el) => {
      el.addEventListener("input", update);
    });

    window.addEventListener("load", update);
  </script>
</body>
</html>
